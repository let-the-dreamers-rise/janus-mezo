[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# Paris bytecode has no PUSH0 or newer opcodes, so it runs on any Mezo node. Mezo's
# BoostVoter is built for London and veMEZO for Osaka.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/fork/data" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2000

# Fork tests execute Mezo's own Osaka-compiled veMEZO bytecode, so the local EVM must
# run the Osaka rules. Use with FOUNDRY_PROFILE=fork FORK_MATSNET=true.
[profile.fork]
evm_version = "osaka"

[lint]
# Mezo epochs and vote windows are defined by block timestamps, so these comparisons
# are the protocol's own rules rather than a manipulation risk worth flagging.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
matsnet = "https://rpc.test.mezo.org"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
